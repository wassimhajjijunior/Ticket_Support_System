<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevOps Academy — a 3D, hands-on program</title>
  <meta name="description" content="An 11-session DevOps curriculum: deeper explanation slide by slide, 3D simulations you drive, and labs you run yourself. Language-agnostic." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <header class="bar">
    <a class="brand" href="#/">
      <span class="mark" aria-hidden="true"></span>
      <span>DevOps Academy</span>
    </a>
    <div class="bar-session" id="bar-session"></div>
    <div class="bar-right">
      <button class="ghost" id="scenes-toggle" type="button" aria-pressed="true" title="Toggle 3D">3D</button>
      <button class="ghost" id="reset-labs" type="button" title="Clear lab progress">reset</button>
    </div>
  </header>

  <main id="stage-area">
    <section id="slide" aria-live="polite"></section>
  </main>

  <nav class="pager" id="pager" aria-label="Slides"></nav>

  <footer class="foot">
    <span id="foot-left">11 sessions · 3D simulations · language-agnostic labs</span>
    <span id="foot-right">0 labs done</span>
  </footer>

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <script src="content.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
