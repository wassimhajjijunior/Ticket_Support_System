spring.application.name=support-tickets
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8080}
# 55432 = docker/docker-compose.dev.yml host port. Chosen because a native PostgreSQL
# on the dev machine already owns 5432 and 5433 on IPv4.
# Inside compose/Kubernetes this is always overridden: DB_URL=jdbc:postgresql://db:5432/ticketsupport
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/ticketsupport}
spring.datasource.username=${DB_USERNAME:tickets}
spring.datasource.password=${DB_PASSWORD:tickets}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=support-tickets
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
