# ---------------------------------------------------------------------------
# CI — runs on every pull request and on main.
#
# Two independent jobs, filtered by path so a web-only change never pays for a
# Maven build (and vice versa). This is the whole reason for the monorepo.
# ---------------------------------------------------------------------------
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# a new push to the same PR cancels the previous run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide what actually changed. Always runs; the other jobs gate on it.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'app/**'
              - 'docker/Dockerfile.api'
              - '.github/workflows/ci.yml'
            frontend:
              - 'web/**'
              - 'docker/Dockerfile.web'
              - '.github/workflows/ci.yml'

  # ------------------------------------------------------------------ backend
  backend:
    name: Backend · build + tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # the wrapper loses its executable bit on a fresh Linux checkout
      - name: Make mvnw executable
        run: chmod +x mvnw

      # `verify` (not `test`) so the Failsafe integration tests run too.
      # Tests use the H2 `test` profile, so no database service is needed.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            app/target/surefire-reports/
            app/target/failsafe-reports/
          retention-days: 7

  # ----------------------------------------------------------------- frontend
  frontend:
    name: Frontend · typecheck + lint + build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Lint
        run: npm run lint

      # API_ORIGIN is compiled into the rewrites at build time.
      # The value is irrelevant for a build-only check; the real one is set
      # in cd.yml when the deployable image is produced.
      - name: Build
        run: npm run build
        env:
          API_ORIGIN: http://api:8080
          NEXT_TELEMETRY_DISABLED: '1'
